minimumLimaVersion: 2.0.0
vmType: vz
arch: aarch64
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260705/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:7df0201546f75b8bcc1044594c806c35749421ad3c9bc1be2a3ab806cfae39cc
cpus: 2
memory: 4GiB
disk: 12GiB
mounts: []
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
portForwards:
  - guestIP: 0.0.0.0
    guestIPMustBeZero: false
    guestPortRange: [1, 65535]
    hostPortRange: [1, 65535]
    proto: any
    ignore: true
nestedVirtualization: true
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eu
      systemd-run --unit=exp035-lease --on-active=30m /usr/bin/systemctl poweroff
      apt-get update
