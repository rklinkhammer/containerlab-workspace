# example topo file with management VRF
# node1 will have vrf MGMT
# node2 will have vrf FOO
name: ceos_vrf
topology:
  kinds:
    arista_ceos:
      env:
        CLAB_MGMT_VRF: MGMT
  nodes:
    node1:
      kind: -{{ kind_code_name }}-
    node2:
      kind: -{{ kind_code_name }}-
      env:
        CLAB_MGMT_VRF: FOO
